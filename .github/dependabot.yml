version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Brisbane
    # Routine dependency upgrades are deliberate short-lived topic PRs.
    # Keep scheduled Dependabot version-update PRs disabled so bot branches do
    # not remain open between maintenance windows.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Brisbane
    # GitHub Actions version upgrades follow the same deliberate maintenance
    # workflow instead of creating persistent bot branches.
    open-pull-requests-limit: 0
