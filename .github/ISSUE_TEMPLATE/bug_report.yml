name: Bug report
description: Report a reproducible Platform component defect
body:
  - type: dropdown
    id: component
    attributes:
      label: Owning component
      options:
        - Connector
        - Host Runtime
        - Human Annotator
        - Platform tooling
        - Unknown
    validations:
      required: true
  - type: textarea
    id: identity
    attributes:
      label: Exact identity
      description: Component version/tree digest, game identity, artifact SHA/MVID and evidence level when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: recording_evidence
    attributes:
      label: Recording evidence and context
      description: For Annotator, include session/runtime IDs, decision sequence, disposition/audit errors, bundle content ID and verifier version if available. State console, reload, pause or modset changes. Do not attach raw sessions, saves or credentials publicly; see docs/ANNOTATOR_COLLECTION.md for private incident transfer.
